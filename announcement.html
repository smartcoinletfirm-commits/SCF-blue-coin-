<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SCF Announcements</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: #0b1d33;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .announcement-container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .announcement {
            background: #102a46;
            border-radius: 15px;
            padding: 25px;
            border-left: 5px solid #2196f3;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .announcement h2 {
            margin-top: 0;
        }

        .date {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Smart Coinlet Firm</h1>
        <p>Announcements</p>
    </div>

    <div class="announcement-container">

        <div class="announcement" id="announcementBox">
            <h2>Welcome to SCF</h2>

            <div class="date">
                Official SCF Announcement
            </div>

            <p id="announcementText">
                Welcome to Smart Coinlet Firm.
                Important announcements and updates will appear here.
            </p>
        </div>

    </div>
<script>
document.addEventListener("DOMContentLoaded", () => {

    const settings =
        JSON.parse(
            localStorage.getItem("scfSettings")
        ) || {};

    const announcementText =
        document.getElementById("announcementText");

    const announcementBox =
        document.getElementById("announcementBox");

    if (settings.announcementVisible === false) {

        announcementBox.style.display = "none";

    } else if (settings.announcement) {

        announcementText.textContent =
            settings.announcement;
    }


    if (settings.backgroundImage) {

        document.body.style.backgroundImage =
            `url("${settings.backgroundImage}")`;

        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center";
        document.body.style.backgroundAttachment = "fixed";
    }

});
    </script>
</body>
</html>
